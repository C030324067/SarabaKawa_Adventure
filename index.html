<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Saraba Kawa Adventure — Special Anniversary Edition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root{
    --pixel-bg:#11163b;
    --pixel-sky:#4fc7f7;
    --pixel-blue:#2b79d8;
    --pixel-navy:#0d1635;
    --pixel-brown:#8b4a2f;
    --pixel-brown-dark:#4a241c;
    --pixel-brown-light:#c77b43;
    --pixel-gold:#ffd34d;
    --pixel-white:#fff8df;
    --pixel-red:#e94b35;
    --pixel-green:#35b85a;
    --pixel-cyan:#33d6d0;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:#090d22;
    font-family:'Press Start 2P', monospace;
    color:var(--pixel-white);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }

  button,input{font:inherit;}
  #game-wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}

  #stage{
    position:relative;
    width:min(96vw,960px);
    aspect-ratio:960/540;
    background:#000;
    overflow:hidden;
    border:5px solid #c9913e;
    box-shadow:0 0 0 3px #2d1b17, 0 14px 0 #070914, 0 24px 50px rgba(0,0,0,.65);
    image-rendering:pixelated;
  }

  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;}

  #stage::after{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:12;
    background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 1px,transparent 1px,transparent 4px);
    mix-blend-mode:screen;
  }

  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;background:rgba(5,10,30,.48);z-index:20;
  }
  .hidden{display:none!important;}

  .glow-title{
    font-family:'Press Start 2P',monospace;font-size:clamp(15px,3vw,30px);line-height:1.55;
    color:var(--pixel-gold);text-shadow:4px 4px 0 #7a351f,0 0 0 #000;margin:0 0 14px;
  }
  .sub-title{font-size:clamp(8px,1.25vw,12px);line-height:1.8;color:#fff;margin:0 0 14px;max-width:760px;}

  .btn{
    font-family:'Press Start 2P',monospace;font-size:clamp(8px,1.25vw,12px);line-height:1.6;
    color:#fff8d7;background:#e78a28;border:4px solid #fff0b0;border-right-color:#7a351f;border-bottom-color:#7a351f;
    padding:11px 16px;cursor:pointer;position:relative;z-index:101;box-shadow:4px 4px 0 #32150f;
    border-radius:0;transition:none;
  }
  .btn:hover{filter:brightness(1.12);}
  .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #32150f;}
  .btn.secondary{background:#2aaeb0;border-color:#b7fff0;border-right-color:#15565e;border-bottom-color:#15565e;box-shadow:4px 4px 0 #0b2b35;}

  #story-dialogue{z-index:60;}
  #story-characters{display:flex;align-items:flex-end;justify-content:center;gap:28px;margin:0 auto 14px;padding:4px 10px 0;min-height:128px;}
  .story-character{width:112px;height:112px;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 5px 0 rgba(0,0,0,.45)) drop-shadow(0 0 10px rgba(255,190,60,.22));transition:transform .18s ease,filter .18s ease;pointer-events:none;user-select:none;}
  #story-obor{transform:translateY(3px) scale(1.06);}
  #story-sesepuh{transform:translateY(4px) scale(1.02);}
  #story-characters.speaker-obor #story-obor{transform:translateY(0) scale(1.12);filter:drop-shadow(0 5px 0 rgba(0,0,0,.45)) drop-shadow(0 0 14px rgba(255,166,35,.55));}
  #story-characters.speaker-sesepuh #story-sesepuh{transform:translateY(0) scale(1.1);filter:drop-shadow(0 5px 0 rgba(0,0,0,.45)) drop-shadow(0 0 14px rgba(255,220,120,.5));}
  #story-text{position:relative;z-index:2;}
  @media(max-width:620px){#story-characters{gap:12px;min-height:102px;} .story-character{width:88px;height:88px;} #story-characters.speaker-obor #story-obor{transform:scale(1.08);} #story-characters.speaker-sesepuh #story-sesepuh{transform:scale(1.06);}}
  #story-dialogue{
    position:absolute;left:18px;right:18px;bottom:14px;background:#111b42;
    border:4px solid #e4a644;box-shadow:6px 6px 0 #241316;padding:13px 16px;z-index:25;
    display:flex;flex-direction:column;gap:8px;align-items:stretch;
  }
  #story-speaker{font-size:clamp(8px,1.3vw,12px);color:#ffd34d;text-shadow:2px 2px 0 #4d291d;}
  #story-text{font-size:clamp(8px,1.2vw,11px);line-height:1.9;color:#fff;min-height:3.2em;}
  #story-buttons{display:flex;justify-content:flex-end;gap:10px;}
  #story-buttons .btn{padding:8px 12px;font-size:clamp(7px,1.05vw,10px);}

  #difficulty-grid{display:grid;grid-template-columns:repeat(2,minmax(160px,1fr));gap:12px;margin-top:8px;width:min(90%,500px);}
  .diff-btn{
    font-family:'Press Start 2P',monospace;font-weight:400;font-size:clamp(8px,1.2vw,11px);line-height:1.7;padding:14px 10px;
    border:4px solid #fff0b0;border-right-color:#3b1c18;border-bottom-color:#3b1c18;cursor:pointer;color:#fff;
    box-shadow:4px 4px 0 #140d14;border-radius:0;text-shadow:2px 2px 0 rgba(0,0,0,.55);
  }
  .diff-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #140d14;}
  .diff-veryeasy{background:#2caa58}.diff-easy{background:#2879c7}.diff-hard{background:#cf6427}.diff-veryhard{background:#b52f45}
  .diff-desc{font-size:7px;line-height:1.8;display:block;font-family:'Press Start 2P',monospace;font-weight:400;opacity:.95;margin-top:7px;}
  #menu-highscore{margin-top:14px;font-size:8px;color:#ffe27b;line-height:1.8;}

  /* Classic arcade HUD */
  #hud{position:absolute;top:0;left:0;right:0;padding:8px 10px 7px;z-index:15;pointer-events:none;}
  #hud-top-row{display:grid;grid-template-columns:1fr 1.25fr 1.2fr 1.2fr;gap:8px;align-items:stretch;}
  .hud-block{background:#151426;border:3px solid #f6e2a2;box-shadow:3px 3px 0 #291718;padding:6px 8px;min-width:0;}
  .hud-label{font-size:7px;color:#fff;line-height:1.7;display:block;}
  .hud-value{font-size:10px;color:#fff;line-height:1.7;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #hud-score{color:#ffd34d;}
  #hud-fruit-count{color:#ffd34d;}
  #hud-fruit-icon{width:22px;height:22px;vertical-align:middle;image-rendering:pixelated;object-fit:contain;margin-right:3px;}
  #level-label{font-family:'Press Start 2P',monospace;font-size:8px;color:#fff;line-height:1.8;}
  .flame-track{height:12px;background:#3a1b1c;border:2px solid #fff2c1;margin-top:3px;overflow:hidden;box-shadow:inset 2px 2px 0 #17101a;}
  #health-bar-fill{height:100%;width:100%;background:#f6bd2d;box-shadow:inset 0 2px 0 #fff06b;transition:width .12s linear;}
  #distance-bar-track{position:relative;height:9px;margin-top:7px;background:#321d22;border:2px solid #f6e2a2;overflow:hidden;}
  #distance-bar-fill{height:100%;width:0;background:#e83e31;box-shadow:inset 0 2px 0 #ffb13b;transition:width .15s linear;}
  #distance-flag{position:absolute;right:3px;top:-6px;font-size:8px;}

  #slide-btn{position:absolute;bottom:14px;right:14px;width:74px;height:62px;background:#2aaeb0;border:4px solid #d6fff2;border-right-color:#15565e;border-bottom-color:#15565e;box-shadow:4px 4px 0 #10242a;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;font-size:8px;color:#071a20;z-index:18;touch-action:none;border-radius:0;}
  #slide-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #10242a;}

  #tap-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Press Start 2P',monospace;font-size:10px;color:#fff;pointer-events:none;text-shadow:3px 3px 0 #000;z-index:14;animation:blink 1.2s steps(1) infinite;}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

  #trivia-box{max-width:min(90%,560px);background:#151426;border:4px solid #e4a644;box-shadow:6px 6px 0 #281618;padding:20px;}
  #trivia-box h3{font-family:'Press Start 2P',monospace;font-size:12px;line-height:1.7;margin:0 0 12px;color:#ffd34d;}
  #trivia-box p{font-family:'Press Start 2P',monospace;font-size:8px;line-height:2;margin:0 0 16px;}

  #gameOverScreen{z-index:100;pointer-events:auto;background:rgba(5,8,20,.56);backdrop-filter:none;}
  #gameOverScreen .btn,#gameOverScreen button{pointer-events:auto;position:relative;z-index:101;}
  #gameover-panel{max-width:min(92%,560px);width:min(92%,560px);position:relative;z-index:101;background:#151426;border:4px solid #e4a644;box-shadow:8px 8px 0 #281618;padding:20px 22px;margin-top:6px;}
  #gameover-panel.win{border-color:#ffe06a;}
  #go-title{margin:0 0 12px;font-size:clamp(13px,2.4vw,24px);}
  #go-stats{margin:10px 0;font-size:8px;line-height:2;color:#fff;}
  #new-record{font-family:'Press Start 2P',monospace;font-size:8px;color:#ffd34d;line-height:1.8;margin:8px 0 12px;padding:5px 7px;animation:blink .9s steps(1) infinite;}
  .go-btn-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative;z-index:101;margin-top:12px;}

  @media(max-width:620px){
    #hud-top-row{grid-template-columns:1fr 1fr;}
    .hud-block:nth-child(3),.hud-block:nth-child(4){grid-row:2;}
    #difficulty-grid{grid-template-columns:1fr;max-width:300px;max-height:60vh;overflow:auto;}
    .sub-title{max-width:90%;}
  }
</style>
</head>
<body>
<div id="game-wrap">
  <div id="stage">
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <!-- STORY INTRO -->
    <div id="screen-intro" class="overlay">
      <div id="tap-hint" class="hidden"></div>
    </div>
    <div id="story-dialogue" class="hidden">
      <div id="story-characters" class="speaker-sesepuh" aria-hidden="true">
        <img id="story-obor" class="story-character" src="obor_wave.png" alt="Si Obor melambaikan tangan">
        <img id="story-sesepuh" class="story-character" src="sesepuh.png" alt="Sesepuh Kota Tanjung">
      </div>
      <div id="story-speaker">Sesepuh Kota Tanjung</div>
      <div id="story-text"></div>
      <div id="story-buttons">
        <button class="btn secondary" id="btn-skip">Skip</button>
        <button class="btn" id="btn-continue">Continue</button>
      </div>
    </div>

    <!-- DIFFICULTY SELECTION -->
    <div id="screen-difficulty" class="overlay hidden">
      <h1 class="glow-title">Pilih Tingkat Kesulitan</h1>
      <p class="sub-title">Semakin tinggi kesulitan, semakin cepat arus Sungai Tabalong menghanyutkanmu!</p>
      <div id="difficulty-grid">
        <button class="diff-btn diff-veryeasy" data-diff="veryeasy">Very Easy<span class="diff-desc">Santai &amp; ramah pemula</span></button>
        <button class="diff-btn diff-easy" data-diff="easy">Easy<span class="diff-desc">Kecepatan sedang</span></button>
        <button class="diff-btn diff-hard" data-diff="hard">Hard<span class="diff-desc">Cepat &amp; padat rintangan</span></button>
        <button class="diff-btn diff-veryhard" data-diff="veryhard">Very Hard<span class="diff-desc">Untuk para juara sejati</span></button>
      </div>
      <div id="menu-highscore">🏆 Rekor Tertinggi: <span id="menu-hs-value">0</span></div>
    </div>

    <!-- HUD -->
    <div id="hud" class="hidden">
      <div id="hud-top-row">
        <div class="hud-block"><span class="hud-label">OBOR</span><span class="hud-value" id="hud-score">000000</span></div>
        <div class="hud-block"><span class="hud-label">LANGSAT</span><span class="hud-value"><img id="hud-fruit-icon" src="langsat.png" alt=""> × <span id="hud-fruit-count">0</span></span></div>
        <div class="hud-block"><span class="hud-label">WORLD</span><span id="level-label">1-1: TANJUNG</span></div>
        <div class="hud-block"><span class="hud-label">FLAME</span><div class="flame-track"><div id="health-bar-fill"></div></div></div>
      </div>
      <div id="distance-bar-track"><div id="distance-bar-fill"></div><div id="distance-flag">◆</div></div>
    </div>
    <button id="slide-btn" class="hidden">SLIDE<br>▼</button>

    <!-- TRIVIA -->
    <div id="screen-trivia" class="overlay hidden">
      <div id="trivia-box">
        <h3>✨ Tahukah Kamu?</h3>
        <p id="trivia-text"></p>
        <button class="btn" id="btn-trivia-continue">Lanjutkan Perjalanan</button>
      </div>
    </div>

    <!-- GAME OVER / WIN -->
    <div id="gameOverScreen" class="overlay hidden">
      <div id="gameover-panel">
        <h2 id="go-title" class="glow-title">Api Padam...</h2>
        <div id="new-record" class="hidden">🎉 REKOR BARU TERCIPTA! 🎉</div>
        <div id="go-stats">
          Skor Akhir: <span id="go-score">0</span><br>
          Rekor Tertinggi: <span id="go-highscore">0</span>
        </div>
        <div class="go-btn-row">
          <button class="btn" id="btn-restart">Main Lagi</button>
          <button class="btn secondary" id="btn-menu">Menu Utama</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* =========================================================
   ASSET LOADING
========================================================= */
// Retro pixel-art sprite hook: cute fiery Si Obor. Replace with an 8-bit/16-bit sprite asset.
const imgObor = new Image(); imgObor.src = 'obor.png';
// Retro pixel-art intro waving sprite.
const imgOborWave = new Image(); imgOborWave.src = 'obor_wave.png';
// Story character asset: Sesepuh Kota Tanjung.
const imgSesepuh = new Image(); imgSesepuh.src = 'sesepuh.png';
// Retro pixel-art crouching/sliding Si Obor sprite.
const imgOborSlide = new Image(); imgOborSlide.src = 'obor_slide.png';
// Retro pixel-art sharp blue water geyser hazard.
const imgRintangan = new Image(); imgRintangan.src = 'rintangan.png';
// Retro pixel-art spinning vortex/tornado hazard.
const imgAngin = new Image(); imgAngin.src = 'angin.png';
const imgLangsat = new Image(); imgLangsat.src = 'langsat.png';
// Stylized 16-bit Tabalong city/parallax background.
const imgBgKota = new Image(); imgBgKota.src = 'bg_kota.png';
// Stylized 16-bit Tabalong forest/mining-route background.
const imgBgHutan = new Image(); imgBgHutan.src = 'bg_hutan.png';
// Stylized 16-bit Liang Tapah cave background.
const imgBgGua = new Image(); imgBgGua.src = 'bg_gua.png';

const bgmGame = new Audio('bgm.mp3');
const sfxLangsat = new Audio('sfx_langsat.mp3');
const sfxWater = new Audio('sfx_water.mp3');
const sfxWind = new Audio('sfx_wind.mp3');
bgmGame.loop = true;

let audioUnlocked = false;
function unlockAudio(){
  if (audioUnlocked) return;
  audioUnlocked = true;
  bgmGame.currentTime = 0;
  const p = bgmGame.play();
  if (p && typeof p.catch === 'function'){ p.catch(()=>{ /* ignore autoplay rejection, will retry on next gesture */ audioUnlocked = false; }); }
}
function playSfx(sfx){
  try{
    sfx.currentTime = 0;
    const p = sfx.play();
    if (p && typeof p.catch === 'function'){ p.catch(()=>{}); }
  } catch(e){ /* ignore */ }
}

function imgReady(im){ return im.complete && im.naturalWidth > 0; }

/* =========================================================
   CANVAS / GLOBAL SETUP
========================================================= */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GROUND_Y = H - 70;
const CEIL_Y = 70;

/* =========================================================
   STATE MACHINE
========================================================= */
const STATE = { INTRO:'intro', DIFFICULTY:'difficulty', PLAYING:'playing', TRIVIA:'trivia', GAMEOVER:'gameover', WIN:'win' };
let gameState = STATE.INTRO;

/* =========================================================
   DOM REFS
========================================================= */
const elIntro = document.getElementById('screen-intro');
const elStoryDialogue = document.getElementById('story-dialogue');
const elStorySpeaker = document.getElementById('story-speaker');
const elStoryText = document.getElementById('story-text');
const storyCharacters = document.getElementById('story-characters');
const btnContinue = document.getElementById('btn-continue');
const btnSkip = document.getElementById('btn-skip');

const elDifficulty = document.getElementById('screen-difficulty');
const menuHsValue = document.getElementById('menu-hs-value');

const elHud = document.getElementById('hud');
const hudScore = document.getElementById('hud-score');
const hudHighscore = document.getElementById('hud-highscore');
const hudFruitCount = document.getElementById('hud-fruit-count');
const levelLabel = document.getElementById('level-label');
const distanceFill = document.getElementById('distance-bar-fill');
const healthFill = document.getElementById('health-bar-fill');
const slideBtn = document.getElementById('slide-btn');

const elTrivia = document.getElementById('screen-trivia');
const triviaText = document.getElementById('trivia-text');
const btnTriviaContinue = document.getElementById('btn-trivia-continue');

const elGameOver = document.getElementById('gameOverScreen');
const goPanel = document.getElementById('gameover-panel');
const goTitle = document.getElementById('go-title');
const goScore = document.getElementById('go-score');
const goHighscore = document.getElementById('go-highscore');
const newRecordEl = document.getElementById('new-record');
const btnRestart = document.getElementById('btn-restart');
const btnMenu = document.getElementById('btn-menu');

/* =========================================================
   HIGH SCORE (localStorage)
========================================================= */
const HS_KEY = 'tabalong_highscore';
function getHighScore(){
  try { return parseInt(localStorage.getItem(HS_KEY), 10) || 0; }
  catch(e){ return 0; }
}
function setHighScore(v){
  try { localStorage.setItem(HS_KEY, String(v)); } catch(e){ /* ignore */ }
}
let highScore = getHighScore();
menuHsValue.textContent = highScore;
if (hudHighscore) hudHighscore.textContent = highScore;

/* =========================================================
   STORY INTRO DATA
========================================================= */
const storyLines = [
  { speaker:"Sesepuh Kota Tanjung", text:"Sebentar lagi Hari Jadi Tabalong tiba... namun Obor Pancasila di tugu kota mulai meredup." },
  { speaker:"Sesepuh Kota Tanjung", text:"Angin dari lembah dan air yang deras telah mengguncang nyala api suci itu selama berhari-hari." },
  { speaker:"Si Obor", text:"Aku, Si Obor, akan menempuh perjalanan dari Kota Tanjung, menembus Jalur Emas Hitam, hingga ke Gua Liang Tapah." },
  { speaker:"Si Obor", text:"Di sana, aku akan menemukan sumber nyala yang akan menghidupkan kembali semangat Tabalong!" },
  { speaker:"Sesepuh Kota Tanjung", text:"Berhati-hatilah, Obor. Air akan menguatkanmu, langsat akan menambah semangatmu, namun angin kencang akan memadamkanmu." },
  { speaker:"Si Obor", text:"Aku siap. Demi Tabalong, nyala ini tidak boleh padam!" }
];
let storyIndex = 0;

function showStoryLine(){
  const line = storyLines[storyIndex];
  elStorySpeaker.textContent = line.speaker;
  elStoryText.textContent = line.text;
  // Both Si Obor and Sesepuh stay above every dialogue line; the active speaker is highlighted.
  storyCharacters.classList.toggle('speaker-obor', line.speaker === 'Si Obor');
  storyCharacters.classList.toggle('speaker-sesepuh', line.speaker === 'Sesepuh Kota Tanjung');
  btnContinue.textContent = (storyIndex === storyLines.length - 1) ? "Mulai!" : "Continue";
}

function startIntro(){
  gameState = STATE.INTRO;
  storyIndex = 0;
  elIntro.classList.remove('hidden');
  elStoryDialogue.classList.remove('hidden');
  elDifficulty.classList.add('hidden');
  elHud.classList.add('hidden');
  slideBtn.classList.add('hidden');
  elTrivia.classList.add('hidden');
  elGameOver.classList.add('hidden');
  showStoryLine();
  introParticles = spawnParticles(46);
  introWaveTimer = 0;
  introWaveT = 0;
  introWaveActive = false;
}

btnContinue.addEventListener('click', ()=>{
  unlockAudio();
  if (storyIndex < storyLines.length - 1){
    storyIndex++;
    showStoryLine();
  } else {
    goToDifficultyScreen();
  }
});
btnSkip.addEventListener('click', ()=>{ unlockAudio(); goToDifficultyScreen(); });

function goToDifficultyScreen(){
  gameState = STATE.DIFFICULTY;
  elIntro.classList.add('hidden');
  elStoryDialogue.classList.add('hidden');
  elDifficulty.classList.remove('hidden');
  elHud.classList.add('hidden');
  elTrivia.classList.add('hidden');
  slideBtn.classList.add('hidden');
  elGameOver.classList.add('hidden');
  menuHsValue.textContent = getHighScore();
}

/* =========================================================
   INTRO VISUAL: WALKING OBOR + EMBER PARTICLES
========================================================= */
let introParticles = [];
function spawnParticles(n){
  const arr = [];
  for(let i=0;i<n;i++){
    arr.push({
      x: Math.random()*W,
      y: Math.random()*H,
      r: 1.2 + Math.random()*2.6,
      speed: 0.3 + Math.random()*0.9,
      drift: (Math.random()-0.5)*0.6,
      hue: Math.random()<0.5 ? '255,190,61' : '255,122,24',
      alpha: 0.4 + Math.random()*0.5
    });
  }
  return arr;
}
let introWalkX = -60;
let introWaveT = 0;
let introWaveTimer = 0;
let introWaveActive = false;
const INTRO_WAVE_INTERVAL = 2600;
const INTRO_WAVE_DURATION = 900;

function updateIntroWave(dt){
  const delta = Math.max(0, Math.min(dt || 16, 100));
  introWaveTimer += delta;
  if (!introWaveActive && introWaveTimer >= INTRO_WAVE_INTERVAL){
    introWaveActive = true;
    introWaveTimer = 0;
  }
  if (introWaveActive){
    introWaveT += delta;
    if (introWaveT >= INTRO_WAVE_DURATION){
      introWaveActive = false;
      introWaveT = 0;
    }
  }
}

function drawIntroScene(dt){
  updateIntroWave(dt);
  // night gradient sky
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b1030'); g.addColorStop(0.6,'#141b45'); g.addColorStop(1,'#241a3a');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // silhouette hills
  ctx.fillStyle = 'rgba(10,12,35,0.9)';
  ctx.beginPath();
  ctx.moveTo(0,H);
  ctx.lineTo(0,H-140);
  for(let x=0;x<=W;x+=60){
    ctx.lineTo(x, H-140 - Math.sin(x*0.01)*30 - 20);
  }
  ctx.lineTo(W,H);
  ctx.closePath();
  ctx.fill();

  // ground line
  ctx.fillStyle = '#0e1230';
  ctx.fillRect(0,H-60,W,60);

  // embers
  introParticles.forEach(p=>{
    p.y -= p.speed;
    p.x += p.drift;
    if (p.y < -10){ p.y = H+10; p.x = Math.random()*W; }
    ctx.beginPath();
    ctx.fillStyle = `rgba(${p.hue},${p.alpha})`;
    ctx.shadowColor = `rgba(${p.hue},0.9)`;
    ctx.shadowBlur = 8;
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  });
  ctx.shadowBlur = 0;

  // Si Obor stands near the center and periodically waves "dada-dada".
  // The subtle sway/scale keeps the intro lively without adding expensive animation work.
  const oborW = 112;
  const oborH = 116;
  const introX = W * 0.5 - oborW * 0.5;
  const bob = Math.sin(performance.now() * 0.004) * 3;
  const introY = H - 60 - oborH + bob;
  const useWaveSprite = introWaveActive && imgReady(imgOborWave);
  const wavePhase = introWaveActive ? introWaveT / INTRO_WAVE_DURATION : 0;
  const waveTilt = introWaveActive ? Math.sin(wavePhase * Math.PI * 4) * 0.045 : 0;
  const waveScale = introWaveActive ? 1 + Math.sin(wavePhase * Math.PI * 2) * 0.025 : 1;
  const introImg = useWaveSprite ? imgOborWave : imgObor;

  ctx.save();
  ctx.translate(introX + oborW/2, introY + oborH/2);
  ctx.rotate(waveTilt);
  ctx.scale(waveScale, waveScale);
  if (imgReady(introImg)){
    ctx.drawImage(introImg, -oborW/2, -oborH/2, oborW, oborH);
  } else {
    ctx.fillStyle = '#ffbe3d';
    ctx.shadowColor = 'rgba(255,150,30,0.9)';
    ctx.shadowBlur = 18;
    roundRect(ctx, -25, -35, 50, 70, 12);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.fillStyle = '#ff5c1a';
    ctx.arc(0, -43, 12, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

/* =========================================================
   DIFFICULTY CONFIG
========================================================= */
const DIFFICULTIES = {
  veryeasy:  { label:"Very Easy",  speed:3.2, spawnInterval:95,  healDrainScale:1.3 },
  easy:      { label:"Easy",       speed:4.4, spawnInterval:78,  healDrainScale:1.0 },
  hard:      { label:"Hard",       speed:6.0, spawnInterval:58,  healDrainScale:0.75 },
  veryhard:  { label:"Very Hard",  speed:7.6, spawnInterval:42,  healDrainScale:0.55 }
};
let currentDifficulty = DIFFICULTIES.easy;

document.querySelectorAll('.diff-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    currentDifficulty = DIFFICULTIES[btn.dataset.diff];
    startGame();
  });
});

/* =========================================================
   LEVELS
========================================================= */
const LEVELS = [
  { name:"Kota Tanjung",       bg:imgBgKota,  length:3200, fallbackColor:['#1b3a5c','#0d1c33'] },
  { name:"Jalur Emas Hitam",   bg:imgBgHutan, length:3400, fallbackColor:['#1a3320','#0c1a10'] },
  { name:"Gua Liang Tapah",    bg:imgBgGua,   length:3600, fallbackColor:['#241626','#0d0710'] }
];
const TOTAL_DISTANCE = LEVELS.reduce((s,l)=>s+l.length,0);

const TRIVIA_FACTS = [
  "Tugu Obor Pancasila adalah salah satu ikon kebanggaan masyarakat Kabupaten Tabalong.",
  "Kabupaten Tabalong terletak di ujung utara Provinsi Kalimantan Selatan.",
  "Sungai Tabalong sejak dahulu menjadi jalur transportasi dan sumber kehidupan warga sekitar.",
  "Buah langsat Tanjung dikenal sebagai salah satu hasil kebun unggulan daerah ini.",
  "Wilayah Tabalong memiliki kekayaan alam yang menjadi salah satu penggerak perekonomian daerah.",
  "Gua-gua alami di kawasan pegunungan Tabalong menyimpan banyak kisah dan legenda rakyat.",
  "Hari Jadi Tabalong selalu dirayakan dengan penuh semangat kebersamaan oleh warganya.",
  "Semangat gotong royong menjadi nilai penting yang terus dijaga masyarakat Tabalong hingga kini."
];
function randomTrivia(){
  return TRIVIA_FACTS[Math.floor(Math.random()*TRIVIA_FACTS.length)];
}

/* =========================================================
   PLAYER
========================================================= */
// Si Obor dibuat lebih gembul/lebar agar proporsi karakter asli tetap terasa.
const PLAYER_W = 96, PLAYER_H = 94;
let player = {
  x: 140,
  y: GROUND_Y - PLAYER_H,
  w: PLAYER_W,
  h: PLAYER_H,
  vy: 0,
  gravityDir: 1,   // 1 = normal (falls to floor), -1 = inverted (falls to ceiling)
  sliding: false,
  animT: 0
};
const GRAVITY = 0.62;
const FLIP_KICK = 9;
const MAX_VY = 14;

function resetPlayer(){
  player.x = 140;
  player.gravityDir = 1;
  player.y = GROUND_Y - PLAYER_H;
  player.vy = 0;
  player.sliding = false;
  player.animT = 0;
}

function flipGravity(){
  if (gameState !== STATE.PLAYING) return;
  player.gravityDir *= -1;
  player.vy = -player.gravityDir * FLIP_KICK;
}

function setSliding(v){
  player.sliding = v;
}

function updatePlayer(){
  player.animT += 1;
  player.vy += GRAVITY * player.gravityDir;
  if (player.vy > MAX_VY) player.vy = MAX_VY;
  if (player.vy < -MAX_VY) player.vy = -MAX_VY;
  player.y += player.vy;

  const fullH = PLAYER_H;
  const curH = player.sliding ? fullH/2 : fullH;
  player.h = curH;

  if (player.gravityDir === 1){
    // anchored toward floor
    const floorTop = GROUND_Y - curH;
    if (player.y > floorTop){ player.y = floorTop; player.vy = 0; }
    const ceilLimit = CEIL_Y;
    if (player.y < ceilLimit){ player.y = ceilLimit; player.vy = 0; }
  } else {
    // anchored toward ceiling
    const ceilTop = CEIL_Y;
    if (player.y < ceilTop){ player.y = ceilTop; player.vy = 0; }
    const floorLimit = GROUND_Y - curH;
    if (player.y > floorLimit){ player.y = floorLimit; player.vy = 0; }
  }
}

function drawPlayer(){
  const img = player.sliding ? imgOborSlide : imgObor;
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  // Thick pixel-era halo/outline improves contrast against detailed Tabalong scenery.
  ctx.shadowColor = 'rgba(255,150,30,.98)';
  ctx.shadowBlur = 14;
  // Gravity hanya membalik arah gerak/posisi Si Obor.
  // Sprite tetap tegak supaya badan dan wajah tidak ikut terbalik saat melayang ke atas.
  drawObor(img, player.x, player.y, player.w, player.h);
  ctx.restore();
}
function drawObor(img,x,y,w,h){
  if (imgReady(img)){
    ctx.drawImage(img, x, y, w, h);
  } else {
    ctx.fillStyle = player.sliding ? '#ff9a4b' : '#ffbe3d';
    ctx.shadowColor = 'rgba(255,150,30,0.85)';
    ctx.shadowBlur = 14;
    roundRect(ctx, x, y, w, h, 8);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.fillStyle = '#ff5c1a';
    ctx.arc(x+w/2, y-4, 8, 0, Math.PI*2);
    ctx.fill();
  }
}

/* =========================================================
   ENTITIES (object pool via filtering)
========================================================= */
let entities = [];
let spawnTimer = 0;

function spawnEntity(){
  const roll = Math.random();
  let type;
  if (roll < 0.34) type = 'water';
  else if (roll < 0.68) type = 'fruit';
  else type = 'wind';

  let e = { type, x: W + 20, vx: -currentDifficulty.speed };

  if (type === 'water'){
    e.w = 76; e.h = 64;
    e.onFloor = Math.random() < 0.5;
    e.y = e.onFloor ? GROUND_Y - e.h : CEIL_Y;
  } else if (type === 'fruit'){
    e.w = 58; e.h = 58;
    const midTop = CEIL_Y + 60, midBottom = GROUND_Y - 60 - e.h;
    e.y = midTop + Math.random()*(midBottom - midTop);
    e.bobT = Math.random()*Math.PI*2;
    e.baseY = e.y;
  } else { // wind
    e.w = 82; e.h = 62;
    const topBand = CEIL_Y + 20, bottomBand = CEIL_Y + (GROUND_Y-CEIL_Y)*0.55;
    e.y = topBand + Math.random()*(bottomBand-topBand);
    e.bobT = Math.random()*Math.PI*2;
    e.baseY = e.y;
  }
  entities.push(e);
}

function updateEntities(){
  spawnTimer++;
  if (spawnTimer >= currentDifficulty.spawnInterval){
    spawnTimer = 0;
    spawnEntity();
  }
  entities.forEach(e=>{
    e.x += e.vx;
    if (e.type === 'fruit'){
      e.bobT += 0.06;
      e.y = e.baseY + Math.sin(e.bobT)*8;
    } else if (e.type === 'wind'){
      e.bobT += 0.045;
      e.y = e.baseY + Math.sin(e.bobT)*14;
    }
  });
  // object pooling: strict filtering once entities clear left boundary
  entities = entities.filter(e => e.x + e.w > -10);
}

function drawPixelShadow(x,y,w,h,color){
  ctx.fillStyle=color; ctx.fillRect(x+5,y+h-4,w-10,5);
}
function drawQuestionBlock(x,y,w,h){
  ctx.fillStyle='#d88a2b'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle='#ffcf4a'; ctx.fillRect(x+3,y+3,w-6,4);
  ctx.fillStyle='#7a3b20'; ctx.fillRect(x+3,y+h-7,w-6,4);
  ctx.strokeStyle='#5a2a1d'; ctx.lineWidth=4; ctx.strokeRect(x+2,y+2,w-4,h-4);
  ctx.fillStyle='#fff2a3'; ctx.font='bold 28px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('?',x+w/2,y+h/2+1);
}
function drawEntities(){
  entities.forEach(e=>{
    let img = e.type==='water'?imgRintangan:e.type==='fruit'?imgLangsat:imgAngin;
    ctx.save(); ctx.imageSmoothingEnabled=false;
    if(e.type==='fruit'){
      // Floating retro item block behind the Langsat.
      drawQuestionBlock(e.x-7,e.y-7,e.w+14,e.h+14);
    }
    // High-contrast pixel shadow / outline keeps hazards readable over busy backgrounds.
    if(e.type==='water') drawPixelShadow(e.x,e.y,e.w,e.h,'#17335d');
    else if(e.type==='wind') drawPixelShadow(e.x,e.y,e.w,e.h,'#1a2347');
    else drawPixelShadow(e.x,e.y,e.w,e.h,'#5c321e');
    ctx.shadowColor = e.type==='water'?'rgba(30,170,255,.9)':e.type==='fruit'?'rgba(255,210,60,.95)':'rgba(230,250,255,.95)';
    ctx.shadowBlur=8;
    if(imgReady(img)) ctx.drawImage(img,e.x,e.y,e.w,e.h);
    else {
      ctx.shadowBlur=0;
      if(e.type==='water'){
        ctx.fillStyle='#29a8ff'; for(let i=0;i<6;i++)ctx.fillRect(e.x+8+i*10,e.y+18-(i%2)*8,7,28+(i%3)*8);
        ctx.fillStyle='#bff5ff'; ctx.fillRect(e.x+13,e.y+12,4,18);
      } else if(e.type==='fruit'){
        ctx.fillStyle='#ffd34d'; ctx.fillRect(e.x+12,e.y+8,34,40); ctx.fillStyle='#f39a25'; ctx.fillRect(e.x+17,e.y+13,24,30); ctx.fillStyle='#8d4d26'; ctx.fillRect(e.x+27,e.y+2,5,10);
      } else {
        ctx.fillStyle='#d9f6ff'; for(let i=0;i<4;i++){ctx.fillRect(e.x+12+i*13,e.y+8+i*7,30-i*5,7);}
      }
    }
    ctx.shadowBlur=0; ctx.restore();
  });
}

/* =========================================================
   COLLISION
========================================================= */
function rectsOverlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

/* =========================================================
   RUN STATE
========================================================= */
let score = 0;
let fruitCount = 0;
let health = 100;
let distance = 0;
let currentLevelIndex = 0;
let pendingLevelIndex = 0;

function startGame(){
  if (bgmGame.paused){
    const p = bgmGame.play();
    if (p && typeof p.catch === 'function') p.catch(()=>{});
  }
  score = 0;
  fruitCount = 0;
  health = 100;
  distance = 0;
  currentLevelIndex = 0;
  entities = [];
  spawnTimer = 0;
  resetPlayer();
  gameState = STATE.PLAYING;

  elDifficulty.classList.add('hidden');
  elTrivia.classList.add('hidden');
  elGameOver.classList.add('hidden');
  elHud.classList.remove('hidden');
  slideBtn.classList.remove('hidden');

  updateHud();
}

function updateHud(){
  hudScore.textContent = String(score).padStart(6,'0');
  if (hudHighscore) hudHighscore.textContent = Math.max(highScore, score);
  if (hudFruitCount) hudFruitCount.textContent = fruitCount;
  const worldNames = ['TANJUNG','MINING','LIANG TAPAH'];
  levelLabel.textContent = `1-${currentLevelIndex+1}: ${worldNames[currentLevelIndex]}`;
  const pct = Math.min(100, (distance/TOTAL_DISTANCE)*100);
  distanceFill.style.width = pct + '%';
  healthFill.style.width = Math.max(0,health) + '%';
}

function levelStartDistance(idx){
  let d=0; for(let i=0;i<idx;i++) d+=LEVELS[i].length; return d;
}

function updateGame(){
  updatePlayer();
  updateEntities();

  distance += currentDifficulty.speed;

  // level threshold check
  const nextIdx = currentLevelIndex+1;
  if (nextIdx < LEVELS.length && distance >= levelStartDistance(nextIdx)){
    pendingLevelIndex = nextIdx;
    triggerTrivia();
    return;
  }
  if (distance >= TOTAL_DISTANCE){
    triggerWin();
    return;
  }

  // collisions
  const hitbox = { x:player.x, y:player.y, w:player.w, h:player.h };
  for (let i=entities.length-1;i>=0;i--){
    const e = entities[i];
    if (rectsOverlap(hitbox, e)){
      if (e.type === 'water'){
        playSfx(sfxWater);
        health = Math.min(100, health + 15*currentDifficulty.healDrainScale);
      } else if (e.type === 'fruit'){
        playSfx(sfxLangsat);
        score += 10;
        fruitCount += 1;
      } else if (e.type === 'wind'){
        playSfx(sfxWind);
        health = Math.max(0, health - 20*(2-currentDifficulty.healDrainScale));
      }
      entities.splice(i,1);
      if (health <= 0){
        triggerGameOver();
        return;
      }
    }
  }

  updateHud();
}

function triggerTrivia(){
  gameState = STATE.TRIVIA;
  triviaText.textContent = randomTrivia();
  elTrivia.classList.remove('hidden');
}
btnTriviaContinue.addEventListener('click', ()=>{
  currentLevelIndex = pendingLevelIndex;
  entities = [];
  elTrivia.classList.add('hidden');
  gameState = STATE.PLAYING;
  updateHud();
});

function finalizeScoreAndShow(won){
  bgmGame.pause();
  try { bgmGame.currentTime = 0; } catch(e) {}
  audioUnlocked = false;
  elTrivia.classList.add('hidden');
  const beat = score > highScore;
  if (beat){ highScore = score; setHighScore(highScore); }
  goTitle.textContent = won ? "Nyala Obor Menyala Kembali!" : "Api Padam...";
  goPanel.classList.toggle('win', won);
  goScore.textContent = score;
  goHighscore.textContent = highScore;
  newRecordEl.classList.toggle('hidden', !beat);
  elHud.classList.add('hidden');
  slideBtn.classList.add('hidden');
  elGameOver.classList.add('hidden');
  window.setTimeout(()=>{
    if (gameState === (won ? STATE.WIN : STATE.GAMEOVER)){
      elGameOver.classList.remove('hidden');
    }
  }, 320);
}

function triggerGameOver(){
  gameState = STATE.GAMEOVER;
  finalizeScoreAndShow(false);
}
function triggerWin(){
  gameState = STATE.WIN;
  finalizeScoreAndShow(true);
}

btnRestart.addEventListener('click', ()=>{ startGame(); });
btnMenu.addEventListener('click', ()=>{ goToDifficultyScreen(); });

/* =========================================================
   BACKGROUND DRAWING (per level, with parallax-ish fallback)
========================================================= */
let bgScrollX = 0;
function drawPixelTile(x,y,w,h,variant){
  const tile = 24;
  for(let yy=y; yy<y+h; yy+=tile){
    for(let xx=x; xx<x+w; xx+=tile){
      const row = Math.floor((yy-y)/tile), col = Math.floor((xx-x)/tile);
      ctx.fillStyle = ((row+col+(variant||0))%2===0) ? '#9a5634' : '#7b3f2a';
      ctx.fillRect(xx,yy,Math.min(tile,w-(xx-x)),Math.min(tile,h-(yy-y)));
      ctx.fillStyle = '#c87842';
      ctx.fillRect(xx+2,yy+2,Math.min(18,w-(xx-x)-4),3);
      ctx.fillStyle = '#4b251d';
      ctx.fillRect(xx,yy+tile-3,Math.min(tile,w-(xx-x)),3);
      if((row+col)%3===0){ ctx.fillStyle='#5d3023'; ctx.fillRect(xx+11,yy+10,4,4); }
    }
  }
}

function drawRetroSkyDecor(){
  // Low-cost pixel clouds, hills and distant Tabalong-inspired silhouettes.
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle='rgba(255,255,255,.7)';
  const clouds=[[120,145,70],[260,120,85],[510,150,80],[760,120,95]];
  clouds.forEach(c=>{
    ctx.fillRect(c[0],c[1],c[2],18); ctx.fillRect(c[0]+18,c[1]-12,30,30); ctx.fillRect(c[0]+42,c[1]-20,34,38);
  });
  ctx.fillStyle='rgba(31,91,105,.55)';
  for(let x=-40;x<W+80;x+=130){
    ctx.fillRect(x,GROUND_Y-120,70,120);
    ctx.fillRect(x+18,GROUND_Y-155,32,35);
  }
  ctx.restore();
}

function drawRetroWorldTiles(){
  // Mario-like repeating brown brick floor and inverted ceiling, recolored for SARABAKAWA.
  drawPixelTile(0,GROUND_Y,W,H-GROUND_Y,0);
  drawPixelTile(0,0,W,CEIL_Y,1);
  // golden trim separates playable lane from tiles
  ctx.fillStyle='#e4a644'; ctx.fillRect(0,GROUND_Y-5,W,5); ctx.fillRect(0,CEIL_Y,W,5);
  ctx.fillStyle='#4a241c'; ctx.fillRect(0,GROUND_Y,W,3); ctx.fillRect(0,CEIL_Y+5,W,3);
}

function drawLevelBackground(){
  const lvl = LEVELS[currentLevelIndex];
  bgScrollX -= currentDifficulty.speed*0.4;
  ctx.imageSmoothingEnabled = false;
  if (imgReady(lvl.bg)){
    const iw=lvl.bg.width, ih=lvl.bg.height;
    const scale=H/ih;
    const drawW=iw*scale;
    let sx=bgScrollX%drawW; if(sx>0)sx-=drawW;
    for(let x=sx;x<W;x+=drawW) ctx.drawImage(lvl.bg,x,0,drawW,H);
  } else {
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,lvl.fallbackColor[0]); g.addColorStop(1,lvl.fallbackColor[1]);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    drawRetroSkyDecor();
  }
  // A subtle pixel tint makes photographic/illustrative backgrounds read as a unified retro game world.
  ctx.fillStyle='rgba(12,22,45,.10)'; ctx.fillRect(0,0,W,H);
  drawRetroWorldTiles();
}

/* =========================================================
   MAIN LOOP
========================================================= */
let lastTime = 0;
function loop(ts){
  const dt = ts - lastTime; lastTime = ts;

  if (gameState === STATE.INTRO){
    drawIntroScene(dt);
  } else if (gameState === STATE.DIFFICULTY){
    drawIntroScene(dt); // keep ambient scene behind difficulty menu
  } else if (gameState === STATE.PLAYING){
    drawLevelBackground();
    updateGame();
    drawEntities();
    drawPlayer();
  } else if (gameState === STATE.TRIVIA){
    drawLevelBackground();
    drawEntities();
    drawPlayer();
  } else if (gameState === STATE.GAMEOVER || gameState === STATE.WIN){
    drawLevelBackground();
    drawEntities();
    drawPlayer();
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =========================================================
   INPUT HANDLING
========================================================= */
function handlePrimaryTap(ev){
  // Never let canvas input interfere with Game Over / Win overlay buttons.
  if (gameState === STATE.GAMEOVER || gameState === STATE.WIN) return;
  if (gameState === STATE.PLAYING){
    flipGravity();
  }
}
canvas.addEventListener('mousedown', handlePrimaryTap);
canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); handlePrimaryTap(e); }, {passive:false});

window.addEventListener('keydown', (e)=>{
  if (e.code === 'Space'){
    e.preventDefault();
    flipGravity();
  } else if (e.code === 'ArrowDown'){
    e.preventDefault();
    setSliding(true);
  }
});
window.addEventListener('keyup', (e)=>{
  if (e.code === 'ArrowDown'){
    setSliding(false);
  }
});

slideBtn.addEventListener('pointerdown', (e)=>{ e.preventDefault(); setSliding(true); });
slideBtn.addEventListener('pointerup', (e)=>{ e.preventDefault(); setSliding(false); });
slideBtn.addEventListener('pointerleave', (e)=>{ setSliding(false); });
slideBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); setSliding(true); }, {passive:false});
slideBtn.addEventListener('touchend', (e)=>{ e.preventDefault(); setSliding(false); }, {passive:false});

/* =========================================================
   INIT
========================================================= */
startIntro();

})();
</script>
